name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck edid-decode
      - name: Check shell scripts
        run: shellcheck -x hdmi2csi2card/enablehdmi.sh tests/test_enablehdmi.sh
      - name: Run script tests
        run: bash tests/test_enablehdmi.sh
      - name: Run EDID tests
        run: python3 tests/test_edid.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - name: Install the aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Build the aarch64 binary
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hdmi-in-aarch64
          path: target/aarch64-unknown-linux-gnu/release/hdmi-in
